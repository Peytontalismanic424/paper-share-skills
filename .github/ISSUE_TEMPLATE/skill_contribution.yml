---
name: 🔀 技能贡献 | Skill Contribution
description: 提交新技能 / 修改现有技能
title: "[Skill] "
labels: ["skill"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请阅读 [CONTRIBUTING.md](../../CONTRIBUTING.md)：SKILL.md frontmatter `name` = 目录名、无个人路径、无贴纸残留、grep + py_compile 检查通过。
  - type: input
    id: skill
    attributes:
      label: 技能目录 | Skill name
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 改动说明 | Change
      description: 新增/修改了什么，行为变化与验证结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查清单 | Checklist
      options:
        - label: grep 检查无个人路径（disco / Paper_Survey_Env / 杨昊波 等）
          required: true
        - label: 所有 .py 通过 py_compile
          required: true
        - label: 无 .venv / voices / cookie 混入
          required: true
